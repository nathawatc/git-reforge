version: 2

project_name: git-reforge

before:
  hooks:
    - go mod tidy

builds:
  - id: git-reforge
    main: .
    binary: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=readonly
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

checksum:
  name_template: SHA256SUMS

snapshot:
  version_template: "{{ incpatch .Version }}-next"
